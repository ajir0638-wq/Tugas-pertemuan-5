<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Enam Gambar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #1f4e79;
            color: white;
        }

        .jarak {
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
        }

        .galeri {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .galeri img {
            width: 100%;
            aspect-ratio: 4 / 3;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <header class="jarak">
    <h1>Cewek Ku</h1>
    </header>

    <div class="galeri">
        <img src="galeri/snaptik-app-7654929733406280980-slide-1.jpg" alt="Gambar 1">
        <img src="galeri/snaptik-app-7654929733406280980-slide-2.jpg" alt="Gambar 2">
        <img src="galeri/snaptik-app-7654929733406280980-slide-3.jpg" alt="Gambar 3">
        <img src="galeri/snaptik-app-7654929733406280980-slide-4.jpg" alt="Gambar 4">
        <img src="galeri/snaptik-app-7654929733406280980-slide-5.jpg" alt="Gambar 5">
        <img src="galeri/snaptik-app-7654929733406280980-slide-6.jpg" alt="Gambar 6">
    </div>
</body>
</html>
