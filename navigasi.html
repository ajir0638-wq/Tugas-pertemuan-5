<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Navigasi</title>
  
  <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        }

    .menu {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        gap: 20px;
        padding: 15px 20px;
        background-color: #2c3e50;
        }

    .menu a {
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        }

    .menu a:hover {
        color: #f1c40f;
        }
  </style>
</head>
<body>
  <nav class="menu">
    <a href="#">Beranda</a>
    <a href="#">Profil</a>
    <a href="#">Galeri</a>
    <a href="#">Artikel</a>
    <a href="#">Kontak</a>
  </nav>
</body>
</html>
